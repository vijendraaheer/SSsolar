{% extends "admin/base_admin.html" %}{% block admin_content %}<div class="page-actions"><p>Add, review and remove SS Solar Solutions office locations.</p><a class="admin-btn" href="{{ url_for('admin.add_office') }}">+ Add Office</a></div><section class="panel table-wrap"><table><thead><tr><th>Office</th><th>City</th><th>Address</th><th>Phone</th><th>Action</th></tr></thead><tbody>{% for o in offices %}<tr><td>{{ o.office_name }}</td><td>{{ o.city }}</td><td>{{ o.address }}</td><td>{{ o.phone }}</td><td><form method="post" action="{{ url_for('admin.delete_office', office_id=o.id) }}" onsubmit="return confirm('Delete office?')"><button class="danger-btn">Delete</button></form></td></tr>{% endfor %}</tbody></table></section>{% endblock %}
