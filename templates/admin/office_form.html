{% extends "admin/base_admin.html" %}{% block admin_content %}<form class="form-panel" method="post" enctype="multipart/form-data"><h2>Add New Office</h2><label>Office Name<input name="office_name" required></label><label>City<input name="city"></label><label>Address<textarea name="address" rows="3"></textarea></label><label>Phone<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Google Maps Link<input name="map_link"></label><label>Opening Hours<input name="opening_hours" placeholder="Mon-Sat: 9 AM - 7 PM"></label><label>Office Image<input type="file" name="image" accept="image/*"></label><button class="admin-btn">Add Office</button></form>{% endblock %}
