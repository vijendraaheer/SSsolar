{% extends "admin/base_admin.html" %}{% block admin_content %}<div class="page-actions"><p>Manage every solar service shown on the customer website.</p><a class="admin-btn" href="{{ url_for('admin.add_service') }}">+ Add Service</a></div><section class="panel table-wrap"><table><thead><tr><th>Service</th><th>Description</th><th>Price/Note</th><th>Action</th></tr></thead><tbody>{% for s in services %}<tr><td>{{ s.name }}</td><td>{{ s.description }}</td><td>{{ s.price }}</td><td><form method="post" action="{{ url_for('admin.delete_service', service_id=s.id) }}" onsubmit="return confirm('Delete service?')"><button class="danger-btn">Delete</button></form></td></tr>{% endfor %}</tbody></table></section>{% endblock %}
