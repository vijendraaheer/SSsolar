{% extends "admin/base_admin.html" %}{% block admin_content %}<form class="form-panel" method="post"><h2>Solar Loan Details</h2><p>Keep the displayed indicative loan information updated. Do not present it as a guaranteed lender offer.</p><label>Title<input name="title" value="{{ setting.title }}"></label><label>Indicative Interest Rate (%)<input type="number" step="0.01" name="interest_rate" value="{{ setting.interest_rate }}"></label><label>Maximum Tenure (Years)<input type="number" name="max_tenure_years" value="{{ setting.max_tenure_years }}"></label><label>Description<textarea name="description" rows="5">{{ setting.description }}</textarea></label><button class="admin-btn">Update Loan Details</button></form>{% endblock %}
