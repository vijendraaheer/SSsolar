{% extends "admin/base_admin.html" %}{% block admin_content %}<div class="page-actions"><p>Keep government-scheme content editable so you can update official information.</p><a class="admin-btn" href="{{ url_for('admin.add_scheme') }}">+ Add Scheme</a></div><section class="panel table-wrap"><table><thead><tr><th>Scheme</th><th>Eligibility</th><th>Subsidy</th><th>Action</th></tr></thead><tbody>{% for s in schemes %}<tr><td>{{ s.name }}</td><td>{{ s.eligibility }}</td><td>{{ s.subsidy_details }}</td><td><form method="post" action="{{ url_for('admin.delete_scheme', scheme_id=s.id) }}" onsubmit="return confirm('Delete scheme?')"><button class="danger-btn">Delete</button></form></td></tr>{% endfor %}</tbody></table></section>{% endblock %}
