{% extends "admin/base_admin.html" %}{% block admin_content %}<form class="form-panel" method="post" enctype="multipart/form-data"><h2>Add Solar Project</h2><div class="form-grid"><label>Project Name<input name="project_name" required></label><label>Customer Name<input name="customer_name"></label><label>Location<input name="location" placeholder="Kota, Rajasthan"></label><label>System Size<input name="system_size" placeholder="5 KW"></label><label>Project Type<select name="project_type"><option>Residential</option><option>Commercial</option><option>Industrial</option><option>Agriculture</option><option>Government</option></select></label><label>Project Cost<input name="cost"></label><label>Installation Date<input name="installation_date" type="date"></label><label>Status<select name="status"><option>Completed</option><option>Ongoing</option></select></label></div><label>Description<textarea name="description" rows="5"></textarea></label><label>Project Main Image<input type="file" name="image" accept="image/*"></label><label class="check"><input type="checkbox" name="featured"> Show this project on Home Page</label><button class="admin-btn">Publish Project</button></form>{% endblock %}
